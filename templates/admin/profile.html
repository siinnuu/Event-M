{% extends "layouts/app.html" %}
{% block title %}Admin Profile{% endblock %}
{% block page_title %}Profile{% endblock %}

{% block content %}
<form method="post" class="form form-narrow">
  <label class="field"><span>Name</span><input type="text" name="name" value="{{ user.name }}" required /></label>
  <label class="field"><span>Email</span><input type="email" name="email" value="{{ user.email }}" required /></label>
  <label class="field"><span>New password</span><input type="password" name="password" placeholder="Leave blank to keep current" /></label>
  <button type="submit" class="btn btn-primary">Save changes</button>
</form>
{% endblock %}
