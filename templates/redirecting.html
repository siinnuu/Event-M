{% extends "base.html" %}
{% block title %}Redirecting{% endblock %}
{% block body_class %}public-page auth-page{% endblock %}

{% block body %}
<div class="auth-wrap">
  <div class="auth-card redirect-card">
    <div class="spinner" aria-hidden="true"></div>
    <h1 class="auth-title">Signing you in</h1>
    <p class="auth-sub">Preparing your workspace…</p>
  </div>
</div>
<meta http-equiv="refresh" content="1;url={{ destination }}" />
<script>
  setTimeout(function () {
    window.location.href = {{ destination|tojson }};
  }, 900);
</script>
{% endblock %}
